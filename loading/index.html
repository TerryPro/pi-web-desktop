<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pi Web</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #101114;
        color: #e6e6e6;
        font: 14px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      .box { text-align: center; max-width: 32rem; padding: 2rem; }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 1rem;
        border: 2px solid #2c2f36; border-top-color: #7aa2f7; border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      pre {
        margin: 1rem 0 0; padding: 0.75rem; text-align: left;
        background: #17191f; border: 1px solid #2c2f36; border-radius: 6px;
        color: #f7768e; font: 12px/1.5 ui-monospace, monospace;
        white-space: pre-wrap; word-break: break-word; display: none;
      }
      .failed .spinner { animation: none; border-top-color: #2c2f36; }
      .failed pre { display: block; }
    </style>
  </head>
  <body>
    <div class="box" id="box">
      <div class="spinner"></div>
      <div id="message">Starting Pi Web…</div>
      <pre id="detail"></pre>
    </div>
  </body>
</html>
