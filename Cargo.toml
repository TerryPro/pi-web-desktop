[package]
name = "pi-web-desktop"
version = "0.12.2"
description = "Desktop shell for Pi Web"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

# A job object with JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE is the only way to make
# the kernel reap the Node sidecar when the shell dies without running its
# exit handler (task manager "End task", a crash).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
